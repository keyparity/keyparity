name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: The npm build runs on plain Node
        run: |
          bun run build:npm
          node dist/cli.js --version
          node dist/cli.js audit --path test/fixtures/app --skip-secrets --strict || test $? -eq 1
          # The default --path is '.', which is how most people run it.
          (cd test/fixtures/app && node ../../../dist/cli.js audit --skip-secrets --include-tests --json | jq -e '.entries | length > 0')
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # shortcut: checks a Signed-off-by line exists, not that it matches the author. Use a DCO app if that matters.
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' ||
              { echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line"; missing=1; }
          done
          exit $missing
