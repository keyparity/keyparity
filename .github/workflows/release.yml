# Builds a draft release by hand: Actions > Release > Run workflow, then type the version.
# Someone checks the draft (GitHard's verify-release.sh) and publishes it. Nothing here publishes.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.1.0 (no v). Must match package.json."
        required: true
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the build provenance
      attestations: write    # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - name: Version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(jq -r .version package.json)" = "$VERSION" || { echo "package.json says $(jq -r .version package.json), not $VERSION"; exit 1; }
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=$([ "$target" = windows-x64 ] && echo .exe || true)
            bun build src/cli.ts --compile --minify --target="bun-$target" --outfile "dist/keyparity-$target$ext"
          done
          ./dist/keyparity-linux-x64 --version
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # Keeps the running draft's notes if there is one.
        run: |
          notes=$(gh release view "v$VERSION" --json body --jq .body 2>/dev/null || true)
          gh release delete "v$VERSION" --yes 2>/dev/null || true
          gh release create "v$VERSION" dist/* --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes "${notes:-Release notes go here.}"
